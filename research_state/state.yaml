  distinct_from: 'First symmetric cross-asset Hilbert-Schmidt Independence Criterion (HSIC) kernel-dependence family ever run. For each trailing window (W_q=256 standardized returns) and each UNORDERED asset pair (i,j), i<j, compute the normalized biased HSIC between the asset-i and asset-j standardized-return series using RBF kernels k(a,b)=exp(-0.5*(a-b)^2) (fixed gamma=0.5 on unit-variance standardized returns): K=k(x_i,x_i), L=k(x_j,x_j), centering H=I-11^T/W_q, Kc=HKH, Lc=HLH, HSIC=(1/(W_q-1)^2)*sum(Kc*Lc). HSIC is zero iff independence and captures ANY nonlinear joint dependence (not just marginals). From the HSIC matrix four DISTINCT scalar symmetric cross-asset HSIC statistics per bar: hsic_mean (mean pairwise HSIC = dependence intensity), hsic_max (max pairwise HSIC = most dependent channel pair), hsic_conc (HHI concentration of HSIC across unordered pairs = how few pair channels carry dependence), hsic_disp (dispersion/std of HSIC across pairs = how uniform dependence is). Distinct from C436 MI (symmetric joint-histogram dependence), C435 TE (directed TE_{i->j}), C437 JSD (marginal-histogram KL divergence), C438 Wasserstein (sorted-quantile-L1 optimal transport), C434 Lyapunov (univariate dynamical divergence), C433 HVG (static graph invariants), C432 EDF-GOF, C431 CQ, C430 dCor, and every family C281B-C438. Price-only (perp_close), volume-free, close-only.'
